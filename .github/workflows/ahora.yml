name: Ahora (rayos, lluvia observada, movimiento y aviso oficial)

# Cada 10 minutos genera ahora.json (lo lee la página) y hist.json (lo usa el script horario para verificar con
# observaciones propias) y los publica en la rama "ahora" (un solo commit que se reemplaza cada vez).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ahora
  cancel-in-progress: false

jobs:
  ahora:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install --quiet netCDF4 numpy pypdf

      - name: Traer el historial anterior (sin pasar por cachés)
        run: |
          git fetch --depth=1 origin ahora:refs/remotes/origin/ahora || true
          git show origin/ahora:hist.json > hist_prev.json 2>/dev/null || rm -f hist_prev.json

      - name: Generar ahora.json y hist.json
        env:
          CC_HIST_PREVIO: hist_prev.json
        run: |
          mkdir -p salida
          python ahora.py salida

      - name: Publicar en la rama ahora
        run: |
          set -e
          cd salida
          git init -q -b ahora
          git config user.name "ClearSky bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ahora.json hist.json
          git commit -q -m "ahora $(date -u +%H:%M)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ahora
