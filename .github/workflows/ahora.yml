name: Ahora (rayos, lluvia observada y aviso oficial)

# Cada 10 minutos genera ahora.json y lo publica en la rama "ahora" (un solo commit que se reemplaza
# cada vez, para no llenar el historial). La página y el servicio de avisos leen ese archivo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ahora
  cancel-in-progress: true

jobs:
  ahora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install --quiet netCDF4 numpy pypdf

      - name: Generar ahora.json
        run: python ahora.py ahora.json

      - name: Publicar en la rama ahora
        run: |
          set -e
          carpeta=$(mktemp -d)
          cp ahora.json "$carpeta/"
          cd "$carpeta"
          git init -q -b ahora
          git config user.name "ClearSky bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ahora.json
          git commit -q -m "ahora $(date -u +%H:%M)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ahora
